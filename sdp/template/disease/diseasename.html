{% extends "layout.html" %}
{% block content %}

<style>
  #images h1{
    padding-top: 30px;
  }
  #images img{
    width: 250px;
    height: auto;
    padding-bottom: 30px;
    padding-right: 5px;      
    padding-left: 5px;
  }
  .middle{
    padding-left: 0px !important;
    height: 185px !important;
    width: auto !important;
  }

       li{
    text-align: left;
  }
 
  ul{
    display: inline-block; 
    text-align: left; 
    padding-right: 30px;
    padding-left: 30px;
  }
  *{
    font-family: 'Open Sans', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0px 0px 0px 0px;
  }
  p{
    padding: 0px 50px 0px 50px;
    line-height: 2; 
  }
  .blue{
    background-color: #B2DDED;
    color: 283779;
  }
  .white{
    background-color: white;
    color: #283779;
  }
  #header, #whatitis, #symptom, #doctor, #howto, footer{
    padding-top: 30px;
    padding-bottom: 30px;
  }
  h1{
    padding-bottom: 30px;
  }
  a{
    color: white;
    font-weight: bold;
  }
  li{
    line-height: 2; 
  }

  #header h1{
    font-size: 50px;
  }

  .tooltip {
    position: relative;
    display: inline-block;
    border-bottom: 0px dotted black;
  }
  .tooltip .tooltiptext {
    visibility: hidden;
    width: 200px;
    background-color: #555;
    color: #fff;
    font-size: 14px;
    text-align: center;
    padding: 3px 5px;
    border-radius: 5px;
    position: absolute;
    z-index: 1;
    bottom: 125%;
    left: 50%;
    margin-left: -60px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .tooltip .tooltiptext::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #555 transparent transparent transparent;
  }
  .tooltip:hover .tooltiptext {
    visibility: visible;
    opacity: 1;
  }

</style>

{% if type != 'info' %}
<section id = "header" class = "blue"> 
  <h1>You have {{ title }}</h1><br>
  <h4>We have detected that your image shows signs of {{ title }} 
    <!-- {% if accuracy != 'test' %} with an Accuracy of {{ accuracy }}% 
    {% endif %}  -->
  </h4>
</section>
{% else %}
{% endif %}

    <section id="suggestdoctor">
      <a class="et_pb_button et_pb_button_3 et_pb_bg_layout_dark" onClick="return suggestdoc();" style="cursor:pointer">Want us to suggest you doctors in your area?</a>
    </section>
  
      <script>
  
  
            function suggestdoc() {
              if (window.navigator.geolocation) {
                window.navigator.geolocation.getCurrentPosition(getPosition)
            }
            else {
                alert('Geolocation not supported by your browser')
            }
            }
  
            function getPosition(position) {
                computeCity(position.coords.latitude, position.coords.longitude)
            }
  
            //using opencage API's data which will tell us about the city name from coordinates
            function computeCity(lati, long) {
                fetch(`https://api.opencagedata.com/geocode/v1/json?q=${lati}+${long}&key=7d0266b0bdde4185b5fb4a9bbf45de2a`)
                    .then(res => res.json())
                    .then(location => {
                        findDoctors(location.results[0].components.state_district)
                    })
                    .catch(() => {
                        alert('Error reported from server, maybe try later?')
                    })
            }
  
            //using openweathermap API to get city via reverse geocoding
            function findDoctors(city) {
                var iframe = document.querySelector('iframe')
              var test = `https://www.google.com/search?q={{ title }}+doctors+in+${city}`
              window.open(test, "_blank")            }
    </script>
  
  {% endblock content %}
